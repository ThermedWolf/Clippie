[package]
name = "clippie"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clippie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# History store; `bundled` compiles its own SQLite so no system lib is needed.
rusqlite = { version = "0.43", features = ["bundled"] }
# UUIDv7 ids sort by creation time; v4 provides the random device id.
uuid = { version = "1.29", features = ["v4", "v7"] }
sha2 = "0.10"
# XDG data dir on Linux, Roaming AppData on Windows.
dirs = "7"

# Version + features mirror tauri's own gtk dependency so both resolve to the
# same crate; needed to reach the GtkWindow and pin its size request (Linux).
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies.gtk]
version = "0.18"
features = ["v3_24"]

# Wayland data-control clipboard: capture + the event-driven watch mechanism.
# (The wl-copy/wl-paste binaries live in a separate crate, so defaults are
# library-only.)
[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
percent-encoding = "2.3"

# Windows clipboard capture: clipboard-win provides the event-driven monitor
# (message-only window) plus file-list reads; arboard handles image (CF_DIB)
# reads; `png` encodes captured bitmaps into content-addressed blob files.
[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["monitor"] }
arboard = "3.7"
png = "0.18"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
